[project]
name = "movie-tracker-e2e"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["pytest-playwright>=0.5"]

# The e2e suite is not a distributable package — installing it only pulls in
# the dependencies. Disable setuptools auto-discovery of the test modules.
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["."]
