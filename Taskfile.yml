version: '3'

tasks:
  install:
    desc: Install dev tools
    cmds:
      - go install github.com/a-h/templ/cmd/templ@latest
      - go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
      - go install github.com/air-verse/air@latest
      - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - go install github.com/evilmartians/lefthook@latest

  generate:
    desc: Generate templ and sqlc code
    cmds:
      - templ generate
      - sqlc generate

  lint:
    desc: Run gofmt and golangci-lint
    cmds:
      - gofmt -l .
      - golangci-lint run

  test:
    desc: Run Go tests
    cmds:
      - go test ./...

  build:
    desc: Build static executable into bin/ (auto-increments build number)
    vars:
      VERSION: v1.0.0
      BUILD:
        sh: go run ./cmd/bumpbuild
    cmds:
      - go build -ldflags "-X main.version={{.VERSION}} -X main.buildNumber={{.BUILD}}" -o bin/movietracker.exe ./cmd/movietracker

  run:
    desc: Start with hot reload (air)
    cmds:
      - air

  test:e2e:
    desc: Run E2E browser tests (requires playwright browsers installed)
    dir: tests/e2e
    cmds:
      - pip install . --quiet
      - playwright install chromium --quiet
      - pytest --browser chromium -v

  migrate-new:
    desc: Create a new migration file (in internal/db/migrations — the //go:embed source)
    cmds:
      - migrate create -ext sql -dir internal/db/migrations -seq {{.CLI_ARGS}}
