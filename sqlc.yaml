version: "2"
sql:
  - engine: "sqlite"
    queries: "internal/db/queries.sql"
    schema: "internal/db/migrations/"
    gen:
      go:
        package: "db"
        out: "internal/db"
        overrides:
          - column: "media.file_created_at"
            go_type:
              import: "database/sql"
              type: "NullTime"
